syntax = "proto3";

package protocol;

option go_package = "github.com/lmorchard/wideboi/internal/protocol";

// -- Layout & Core Types --

enum LayoutMode {
  LAYOUT_SCROLL = 0;
  LAYOUT_CARDS = 1;
}

message ColumnData {
  int32 pane_id = 1;
  int32 width = 2;
  int32 height = 3;
}

message Rectangle {
  int32 min_x = 1;
  int32 min_y = 2;
  int32 max_x = 3;
  int32 max_y = 4;
}

enum PlacementKind {
  PLACEMENT_FULL = 0;
  PLACEMENT_SLIVER = 1;
}

message PlacementData {
  int32 pane_id = 1;
  Rectangle src = 2;
  Rectangle dst = 3;
  int32 z = 4;
  PlacementKind kind = 5;
}

// -- Styling & Wire Data --

enum ColorKind {
  COLOR_NONE = 0;
  COLOR_BASIC = 1;
  COLOR_INDEXED = 2;
  COLOR_RGBA = 3;
}

message ColorData {
  ColorKind kind = 1;
  uint32 index = 2; // uint8 in Go
  uint32 r = 3;     // uint8 in Go
  uint32 g = 4;
  uint32 b = 5;
  uint32 a = 6;
}

message StyleData {
  ColorData fg = 1;
  ColorData bg = 2;
  ColorData underline_color = 3;
  uint32 underline = 4; // uint8 in Go
  uint32 attrs = 5;     // uint8 in Go
}

message CellData {
  string content = 1;
  int32 width = 2;
  StyleData style = 3;
}

message LineData {
  repeated CellData cells = 1;
}

message KeyData {
  string text = 1;
  int32 mod = 2;
  int32 code = 3;          // rune (int32)
  int32 shifted_code = 4;  // rune (int32)
  int32 base_code = 5;     // rune (int32)
  bool is_repeat = 6;
}

enum MouseKind {
  MOUSE_PRESS = 0;
  MOUSE_RELEASE = 1;
  MOUSE_MOTION = 2;
  MOUSE_WHEEL = 3;
}

// -- Client -> Server Messages --

message MsgAttach {
  int32 cols = 1;
  int32 rows = 2;
}

enum VerbType {
  VERB_NONE = 0;
  VERB_FOCUS_LEFT = 1;
  VERB_FOCUS_RIGHT = 2;
  VERB_NEW_COLUMN = 3;
  VERB_CYCLE_WIDTH = 4;
  VERB_KILL_PANE = 5;
  VERB_SMART_JUMP = 6;
  VERB_TOGGLE_CARDS = 7;
  VERB_GROW_WIDTH = 8;
  VERB_SHRINK_WIDTH = 9;
  VERB_MOVE_LEFT = 10;
  VERB_MOVE_RIGHT = 11;
  VERB_FOCUS_LAST = 12;
}

message MsgVerb {
  VerbType verb = 1;
}

message MsgFocusPane {
  int32 pane_id = 1;
}

message MsgMouse {
  int32 pane_id = 1;
  MouseKind kind = 2;
  int32 x = 3;
  int32 y = 4;
  int32 button = 5;
  int32 mod = 6;
}

message MsgInput {
  int32 pane_id = 1;
  KeyData key = 2;
  bytes data = 3;
}

message MsgResize {
  int32 cols = 1;
  int32 rows = 2;
}

message MsgScroll {
  int32 pane_id = 1;
  int32 delta = 2;
}

message MsgDetach {
  // Empty
}

message MsgShutdown {
  // Empty
}

// ClientEnvelope wraps all possible client-to-server messages
message ClientEnvelope {
  oneof payload {
    MsgAttach attach = 1;
    MsgVerb verb = 2;
    MsgFocusPane focus_pane = 3;
    MsgMouse mouse = 4;
    MsgInput input = 5;
    MsgResize resize = 6;
    MsgScroll scroll = 7;
    MsgDetach detach = 8;
    MsgShutdown shutdown = 9;
  }
}

// -- Server -> Client Messages --

message MsgLayoutSnapshot {
  repeated ColumnData columns = 1;
  repeated PlacementData placements = 2;
  int32 focus_pane_id = 3;
  map<int32, string> pane_statuses = 4;
  map<int32, string> pane_titles = 5;
  LayoutMode layout = 6;
}

message MsgPaneUpdate {
  int32 pane_id = 1;
  int32 cols = 2;
  int32 rows = 3;
  repeated LineData lines = 4;
  int32 cursor_x = 5;
  int32 cursor_y = 6;
  bool cursor_visible = 7;
  bool mouse_tracking = 8;
}

message MsgPaneClosed {
  int32 pane_id = 1;
  int32 exit_code = 2;
}

// ServerEnvelope wraps all possible server-to-client messages
message ServerEnvelope {
  oneof payload {
    MsgLayoutSnapshot layout_snapshot = 1;
    MsgPaneUpdate pane_update = 2;
    MsgPaneClosed pane_closed = 3;
  }
}
