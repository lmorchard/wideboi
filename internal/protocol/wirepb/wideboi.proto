syntax = "proto3";

package wideboi.protocol;
option go_package = "github.com/lmorchard/wideboi/internal/protocol/wirepb";

// The wire schema for both transports. internal/protocol/codec.go maps the
// Go structs in internal/protocol to these messages; the browser uses the
// generated TypeScript directly.
//
// On the wire, absence means zero, never "unchanged": proto3 omits zero
// scalars and empty sub-messages. Patches stay row-granular for that reason.
// A field-level delta would need explicit presence (`optional`).

enum VerbType {
  VERB_TYPE_UNSPECIFIED = 0;
  VERB_TYPE_FOCUS_LEFT = 1;
  VERB_TYPE_FOCUS_RIGHT = 2;
  VERB_TYPE_NEW_COLUMN = 3;
  VERB_TYPE_CYCLE_WIDTH = 4;
  VERB_TYPE_KILL_PANE = 5;
  VERB_TYPE_SMART_JUMP = 6;
  VERB_TYPE_TOGGLE_CARDS = 7;
  VERB_TYPE_GROW_WIDTH = 8;
  VERB_TYPE_SHRINK_WIDTH = 9;
  VERB_TYPE_MOVE_LEFT = 10;
  VERB_TYPE_MOVE_RIGHT = 11;
  VERB_TYPE_FOCUS_LAST = 12;
  VERB_TYPE_TOGGLE_STATUS = 13;
  VERB_TYPE_CLAIM_SIZE = 14;
  VERB_TYPE_TOGGLE_PIN = 15;
  VERB_TYPE_PIN_PANE = 16;
  VERB_TYPE_UNPIN_PANE = 17;
  VERB_TYPE_TOGGLE_COLLAPSE = 18;
  VERB_TYPE_COLLAPSE_PANE = 19;
  VERB_TYPE_UNCOLLAPSE_PANE = 20;
}

enum PaneStatus {
  PANE_STATUS_IDLE = 0;
  PANE_STATUS_WORKING = 1;
  PANE_STATUS_NEEDS_INPUT = 2;
  PANE_STATUS_DONE = 3;
  PANE_STATUS_FAILED = 4;
  PANE_STATUS_INTERRUPTED = 5;
}

enum ColorKind {
  COLOR_KIND_NONE = 0;
  COLOR_KIND_BASIC = 1;
  COLOR_KIND_INDEXED = 2;
  COLOR_KIND_RGBA = 3;
}

message ColorData {
  ColorKind kind = 1;
  uint32 index = 2;
  uint32 r = 3;
  uint32 g = 4;
  uint32 b = 5;
  uint32 a = 6;
}

message StyleData {
  ColorData fg = 1;
  ColorData bg = 2;
  ColorData underline_color = 3;
  uint32 underline = 4;
  uint32 attrs = 5;
}

message CellData {
  string content = 1;
  int32 width = 2;
  StyleData style = 3;
  uint32 link_id = 4;
}

message LineData {
  repeated CellData cells = 1;
  bool wrapped = 2;
}

// Generations arrive in the browser as bigint (protobuf-es ignores
// jstype = JS_NUMBER). Compare them only with other generations.
message MsgPaneUpdate {
  int32 pane_id = 1;
  uint64 generation = 2;
  int32 cols = 3;
  int32 rows = 4;
  repeated LineData lines = 5;
  int32 cursor_x = 6;
  int32 cursor_y = 7;
  bool cursor_visible = 8;
  bool mouse_tracking = 9;
  int32 scroll_offset = 10;
  int32 scrollback_len = 11;
  bool unread_output = 12;
  repeated string links = 13;
}

// PaneRow replaces one complete row, style and wide-glyph continuations
// included.
message PaneRow {
  int32 y = 1;
  repeated CellData cells = 2;
  bool wrapped = 3;
}

// MsgPanePatch changes a pane relative to an exact client baseline. Its
// cursor and mouse fields always overwrite; rows may be empty.
message MsgPanePatch {
  int32 pane_id = 1;
  int32 cols = 2;
  int32 rows = 3;
  uint64 base_generation = 4;
  uint64 generation = 5;
  repeated PaneRow changed_rows = 6;
  int32 cursor_x = 7;
  int32 cursor_y = 8;
  bool cursor_visible = 9;
  bool mouse_tracking = 10;
  int32 shift_rows = 11;
  int32 scroll_offset = 12;
  int32 scrollback_len = 13;
  bool unread_output = 14;
  repeated string links = 15;
}

message ColumnData {
  int32 pane_id = 1;
  int32 width = 2;
  int32 height = 3;
  bool pinned = 4;
  bool collapsed = 5;
}

message MsgLayoutSnapshot {
  repeated ColumnData columns = 1;
  map<int32, PaneStatus> pane_statuses = 2;
  map<int32, string> pane_titles = 3;
  string session_cwd = 4;
  int32 attached_clients = 5;
}

message MsgPaneCreated {
  int32 pane_id = 1;
}

message MsgPaneClosed {
  int32 pane_id = 1;
  int32 exit_code = 2;
}

message MsgPaneMetadata {
  int32 pane_id = 1;
  string cwd = 2;
  map<string, string> user_vars = 3;
  bool exited = 4;
  int32 exit_code = 5;
}

message MsgFocusPane {
  int32 pane_id = 1;
}

message MsgPaneNotification {
  int32 pane_id = 1;
  string title = 2;
  string message = 3;
}

message MsgPaneClipboard {
  int32 pane_id = 1;
  string title = 2;
  string text = 3;
}

message MsgShowClipboardRequest {}

message MsgShowClipboardResponse {
  int32 pane_id = 1;
  string title = 2;
  string text = 3;
  int64 unix_milli = 4;
  string error = 5;
}

message ServerMessage {
  oneof msg {
    MsgPaneUpdate pane_update = 1;
    MsgPanePatch pane_patch = 2;
    MsgLayoutSnapshot layout_snapshot = 3;
    MsgPaneCreated pane_created = 4;
    MsgPaneClosed pane_closed = 5;
    MsgPaneMetadata pane_metadata = 6;
    MsgTrafficStats traffic_stats = 7;
    MsgFocusPane focus_pane = 8;
    MsgSplitResponse split_response = 9;
    MsgSendInputResponse send_input_response = 10;
    MsgCaptureResponse capture_response = 11;
    MsgClosePaneResponse close_pane_response = 12;
    MsgHistorySnapshot history_snapshot = 13;
    MsgWaitResponse wait_response = 14;
    MsgMacrosSnapshot macros_snapshot = 15;
    MsgUpgradeResponse upgrade_response = 16;
    MsgWebServerControlResponse web_server_control_response = 17;
    MsgConfigSnapshot config_snapshot = 18;
    MsgPaneNotification pane_notification = 19;
    MsgRenamePaneResponse rename_pane_response = 20;
    MsgDumpPaneResponse dump_pane_response = 21;
    MsgPipePaneResponse pipe_pane_response = 22;
    MsgSetPaneStatusResponse set_pane_status_response = 23;
    MsgWaitOutputResponse wait_output_response = 24;
    MsgWaitStatusResponse wait_status_response = 25;
    MsgPaneClipboard pane_clipboard = 26;
    MsgShowClipboardResponse show_clipboard_response = 27;
  }
}

message MsgAttach {
  int32 cols = 1;
  int32 rows = 2;
}

message MsgVerb {
  VerbType verb = 1;
  int32 pane_id = 2;
  map<int32, int32> widths = 3;
}

message MsgSetPaneWidth {
  int32 pane_id = 1;
  int32 width = 2;
}

enum MouseKind {
  MOUSE_KIND_PRESS = 0;
  MOUSE_KIND_RELEASE = 1;
  MOUSE_KIND_MOTION = 2;
  MOUSE_KIND_WHEEL = 3;
}

message MsgMouse {
  int32 pane_id = 1;
  MouseKind kind = 2;
  int32 x = 3;
  int32 y = 4;
  int32 button = 5;
  int32 mod = 6;
}

message KeyData {
  string text = 1;
  int32 mod = 2;
  int32 code = 3;
  int32 shifted_code = 4;
  int32 base_code = 5;
  bool is_repeat = 6;
}

message MsgInput {
  int32 pane_id = 1;
  KeyData key = 2;
  bytes data = 3;
  bool paste = 4;
}

message MsgResize {
  int32 cols = 1;
  int32 rows = 2;
}

message MsgScroll {
  int32 pane_id = 1;
  int32 delta = 2;
  bool set_absolute = 3;
  int32 offset = 4;
  bool anchor_history = 5;
  int32 history_len = 6;
}

// Plain physical rows, oldest first. Search is performed by the client.
message MsgHistoryRequest { int32 pane_id = 1; }
message MsgHistorySnapshot {
  int32 pane_id = 1;
  int32 scrollback_len = 2;
  repeated string rows = 3;
}

message MsgPaneResync {
  int32 pane_id = 1;
}

message MsgDetach {}

message MsgShutdown {}

message MsgStatusRequest {}

message ClientMessage {
  oneof msg {
    MsgAttach attach = 1;
    MsgVerb verb = 2;
    MsgMouse mouse = 3;
    MsgInput input = 4;
    MsgResize resize = 5;
    MsgScroll scroll = 6;
    MsgPaneResync pane_resync = 7;
    MsgDetach detach = 8;
    MsgShutdown shutdown = 9;
    MsgStatusRequest status_request = 10;
    MsgTrafficRequest traffic_request = 11;
    MsgSplitRequest split_request = 12;
    MsgSendInputRequest send_input_request = 13;
    MsgCaptureRequest capture_request = 14;
    MsgClosePaneRequest close_pane_request = 15;
    MsgHistoryRequest history_request = 16;
    MsgWaitRequest wait_request = 17;
    MsgSetPaneWidth set_pane_width = 18;
    MsgSaveMacros save_macros = 19;
    MsgUpgradeRequest upgrade_request = 20;
    MsgWebServerControlRequest web_server_control_request = 21;
    MsgRenamePaneRequest rename_pane_request = 22;
    MsgDumpPaneRequest dump_pane_request = 23;
    MsgPipePaneRequest pipe_pane_request = 24;
    MsgSetPaneStatusRequest set_pane_status_request = 25;
    MsgWaitOutputRequest wait_output_request = 26;
    MsgWaitStatusRequest wait_status_request = 27;
    MsgShowClipboardRequest show_clipboard_request = 28;
  }
}

message MsgWaitOutputRequest {
  int32 pane_id = 1;
  string match = 2;
  string regex = 3;
  int32 lines = 4;
}

message MsgWaitOutputResponse {
  int32 pane_id = 1;
  string matched_line = 2;
  string error = 3;
}

message MsgWaitStatusRequest {
  int32 pane_id = 1;
  repeated PaneStatus until = 2;
}

message MsgWaitStatusResponse {
  int32 pane_id = 1;
  PaneStatus status = 2;
  string error = 3;
}

message MsgSetPaneStatusRequest {
  int32 pane_id = 1;
  PaneStatus status = 2;
  bool clear = 3;
}

message MsgSetPaneStatusResponse {
  int32 pane_id = 1;
  string error = 2;
}

message MsgPipePaneRequest {
  int32 pane_id = 1;
}

message MsgPipePaneResponse {
  int32 pane_id = 1;
  bytes data = 2;
  bool closed = 3;
  string error = 4;
}

message MsgDumpPaneRequest {
  int32 pane_id = 1;
  bool scrollback = 2;
  int32 offset = 3;
  int32 limit = 4;
  int32 tail_lines = 5;
  bool ansi = 6;
  bool count_only = 7;
}

message MsgDumpPaneResponse {
  int32 pane_id = 1;
  string text = 2;
  string error = 3;
  int32 total_lines = 4;
  int32 offset = 5;
  int32 lines = 6;
}

message MsgUpgradeRequest {
  string bin_path = 1;
}

message MsgUpgradeResponse {
  string error = 1;
}

message MsgWaitRequest {
  int32 pane_id = 1;
}

message MsgWaitResponse {
  int32 pane_id = 1;
  int32 exit_code = 2;
  string error = 3;
}

message MsgSplitRequest {
  string command = 1;
  string cwd = 2;
  int32 after_pane_id = 3;
  bool keep = 4;
}

message MsgSplitResponse {
  int32 pane_id = 1;
  string error = 2;
}

message MsgSendInputRequest {
  int32 pane_id = 1;
  bytes data = 2;
}

message MsgSendInputResponse {
  int32 pane_id = 1;
  string error = 2;
}

message MsgCaptureRequest {
  int32 pane_id = 1;
  bool scrollback = 2;
  int32 lines = 3;
}

message MsgCaptureResponse {
  int32 pane_id = 1;
  string text = 2;
  string error = 3;
}

message MsgClosePaneRequest {
  int32 pane_id = 1;
}

message MsgClosePaneResponse {
  int32 pane_id = 1;
  string error = 2;
}

message MsgRenamePaneRequest {
  int32 pane_id = 1;
  string title = 2;
  bool clear = 3;
}

message MsgRenamePaneResponse {
  int32 pane_id = 1;
  string error = 2;
}

// Traffic counters for `wideboi status --traffic` (#179). Counts and
// timings only: never cell contents, titles, input or tokens.
message MsgTrafficRequest {}

message TimingStat {
  uint64 count = 1;
  uint64 total_nanos = 2;
  uint64 max_nanos = 3;
}

message ClientTraffic {
  int32 client_id = 1;
  string transport = 2;           // "socket", "websocket", "inproc"
  int64 connected_millis = 3;
  uint64 full_updates = 4;
  uint64 row_patches = 5;
  uint64 shift_patches = 6;
  uint64 changed_rows = 7;
  uint64 resync_requests = 8;
  uint64 send_failures = 9;
  uint64 messages = 10;           // every message the transport encoded
  uint64 payload_bytes = 11;      // protobuf envelope bytes, all messages
  uint64 pane_payload_bytes = 12; // protobuf bytes of pane updates + patches
  uint64 wire_bytes = 13;         // bytes written to the net.Conn
  TimingStat encode = 14;
}

message MsgTrafficStats {
  int64 uptime_millis = 1;
  bool timing_enabled = 2;
  repeated ClientTraffic clients = 3;
  ClientTraffic departed = 4;     // sum over attached clients that have left
  TimingStat render = 5;
  TimingStat build_patch = 6;
}

message MacroStep {
  string text = 1;
  string key = 2;
  string code = 3;
  bool ctrl = 4;
  bool alt = 5;
  bool shift = 6;
}

message Macro {
  string name = 1;
  repeated MacroStep steps = 2;
}

message MsgMacrosSnapshot {
  repeated Macro macros = 1;
}

message MsgSaveMacros {
  repeated Macro macros = 1;
}

enum WebServerAction {
  WEB_SERVER_ACTION_UNSPECIFIED = 0;
  WEB_SERVER_ACTION_STATUS = 1;
  WEB_SERVER_ACTION_START = 2;
  WEB_SERVER_ACTION_STOP = 3;
}

message MsgWebServerControlRequest {
  WebServerAction action = 1;
  string addr = 2;
  string token = 3;
  bool rotate_token = 4;
  bool disable_tls = 5;
  bool enable_tls = 6;
}

message MsgWebServerControlResponse {
  bool running = 1;
  string addr = 2;
  string url = 3;
  bool tls_enabled = 4;
  string token = 5;
  string error = 6;
  string warning = 7;
}

message KeyBindingData {
  string action_name = 1;
  string key = 2;
  repeated string aliases = 3;
  int32 action = 4;
  VerbType verb = 5;
  int32 scroll = 6;
  int32 pan = 7;
  int32 column = 8;
  string bar_group = 9;
  string long = 10;
  string help_group = 11;
  string help_key = 12;
  bool needs_detach = 13;
  bool essential = 14;
  bool no_repeat = 15;
}

message MsgConfigSnapshot {
  repeated int32 width_presets = 1;
  int32 min_column_width = 2;
  int32 max_column_width = 3;
  repeated KeyBindingData bindings = 4;
}



