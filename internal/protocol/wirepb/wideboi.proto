syntax = "proto3";

package wideboi.protocol;
option go_package = "github.com/lmorchard/wideboi/internal/protocol/wirepb";

// The wire schema for both transports. internal/protocol/codec.go maps the
// Go structs in internal/protocol to these messages; the browser uses the
// generated TypeScript directly.
//
// On the wire, absence means zero, never "unchanged": proto3 omits zero
// scalars and empty sub-messages. Patches stay row-granular for that reason.
// A field-level delta would need explicit presence (`optional`).

enum VerbType {
  VERB_TYPE_UNSPECIFIED = 0;
  VERB_TYPE_FOCUS_LEFT = 1;
  VERB_TYPE_FOCUS_RIGHT = 2;
  VERB_TYPE_NEW_COLUMN = 3;
  VERB_TYPE_CYCLE_WIDTH = 4;
  VERB_TYPE_KILL_PANE = 5;
  VERB_TYPE_SMART_JUMP = 6;
  VERB_TYPE_TOGGLE_CARDS = 7;
  VERB_TYPE_GROW_WIDTH = 8;
  VERB_TYPE_SHRINK_WIDTH = 9;
  VERB_TYPE_MOVE_LEFT = 10;
  VERB_TYPE_MOVE_RIGHT = 11;
  VERB_TYPE_FOCUS_LAST = 12;
  VERB_TYPE_TOGGLE_STATUS = 13;
  VERB_TYPE_CLAIM_SIZE = 14;
}

enum PaneStatus {
  PANE_STATUS_IDLE = 0;
  PANE_STATUS_WORKING = 1;
  PANE_STATUS_NEEDS_INPUT = 2;
  PANE_STATUS_DONE = 3;
  PANE_STATUS_FAILED = 4;
}

enum ColorKind {
  COLOR_KIND_NONE = 0;
  COLOR_KIND_BASIC = 1;
  COLOR_KIND_INDEXED = 2;
  COLOR_KIND_RGBA = 3;
}

message ColorData {
  ColorKind kind = 1;
  uint32 index = 2;
  uint32 r = 3;
  uint32 g = 4;
  uint32 b = 5;
  uint32 a = 6;
}

message StyleData {
  ColorData fg = 1;
  ColorData bg = 2;
  ColorData underline_color = 3;
  uint32 underline = 4;
  uint32 attrs = 5;
}

message CellData {
  string content = 1;
  int32 width = 2;
  StyleData style = 3;
}

message LineData {
  repeated CellData cells = 1;
}

// Generations arrive in the browser as bigint (protobuf-es ignores
// jstype = JS_NUMBER). Compare them only with other generations.
message MsgPaneUpdate {
  int32 pane_id = 1;
  uint64 generation = 2;
  int32 cols = 3;
  int32 rows = 4;
  repeated LineData lines = 5;
  int32 cursor_x = 6;
  int32 cursor_y = 7;
  bool cursor_visible = 8;
  bool mouse_tracking = 9;
  int32 scroll_offset = 10;
  int32 scrollback_len = 11;
  bool unread_output = 12;
}

// PaneRow replaces one complete row, style and wide-glyph continuations
// included.
message PaneRow {
  int32 y = 1;
  repeated CellData cells = 2;
}

// MsgPanePatch changes a pane relative to an exact client baseline. Its
// cursor and mouse fields always overwrite; rows may be empty.
message MsgPanePatch {
  int32 pane_id = 1;
  int32 cols = 2;
  int32 rows = 3;
  uint64 base_generation = 4;
  uint64 generation = 5;
  repeated PaneRow changed_rows = 6;
  int32 cursor_x = 7;
  int32 cursor_y = 8;
  bool cursor_visible = 9;
  bool mouse_tracking = 10;
  int32 shift_rows = 11;
  int32 scroll_offset = 12;
  int32 scrollback_len = 13;
  bool unread_output = 14;
}

message ColumnData {
  int32 pane_id = 1;
  int32 width = 2;
  int32 height = 3;
}

message MsgLayoutSnapshot {
  repeated ColumnData columns = 1;
  map<int32, PaneStatus> pane_statuses = 2;
  map<int32, string> pane_titles = 3;
}

message MsgPaneCreated {
  int32 pane_id = 1;
}

message MsgPaneClosed {
  int32 pane_id = 1;
  int32 exit_code = 2;
}

message MsgPaneMetadata {
  int32 pane_id = 1;
  string cwd = 2;
  map<string, string> user_vars = 3;
  bool exited = 4;
  int32 exit_code = 5;
}

message MsgFocusPane {
  int32 pane_id = 1;
}

message ServerMessage {
  oneof msg {
    MsgPaneUpdate pane_update = 1;
    MsgPanePatch pane_patch = 2;
    MsgLayoutSnapshot layout_snapshot = 3;
    MsgPaneCreated pane_created = 4;
    MsgPaneClosed pane_closed = 5;
    MsgPaneMetadata pane_metadata = 6;
    MsgTrafficStats traffic_stats = 7;
    MsgFocusPane focus_pane = 8;
    MsgSplitResponse split_response = 9;
    MsgSendInputResponse send_input_response = 10;
    MsgCaptureResponse capture_response = 11;
    MsgClosePaneResponse close_pane_response = 12;
    MsgHistorySnapshot history_snapshot = 13;
    MsgWaitResponse wait_response = 14;
  }
}

message MsgAttach {
  int32 cols = 1;
  int32 rows = 2;
}

message MsgVerb {
  VerbType verb = 1;
  int32 pane_id = 2;
  map<int32, int32> widths = 3;
}

message MsgSetPaneWidth {
  int32 pane_id = 1;
  int32 width = 2;
}

enum MouseKind {
  MOUSE_KIND_PRESS = 0;
  MOUSE_KIND_RELEASE = 1;
  MOUSE_KIND_MOTION = 2;
  MOUSE_KIND_WHEEL = 3;
}

message MsgMouse {
  int32 pane_id = 1;
  MouseKind kind = 2;
  int32 x = 3;
  int32 y = 4;
  int32 button = 5;
  int32 mod = 6;
}

message KeyData {
  string text = 1;
  int32 mod = 2;
  int32 code = 3;
  int32 shifted_code = 4;
  int32 base_code = 5;
  bool is_repeat = 6;
}

message MsgInput {
  int32 pane_id = 1;
  KeyData key = 2;
  bytes data = 3;
}

message MsgResize {
  int32 cols = 1;
  int32 rows = 2;
}

message MsgScroll {
  int32 pane_id = 1;
  int32 delta = 2;
  bool set_absolute = 3;
  int32 offset = 4;
  bool anchor_history = 5;
  int32 history_len = 6;
}

// Plain physical rows, oldest first. Search is performed by the client.
message MsgHistoryRequest { int32 pane_id = 1; }
message MsgHistorySnapshot {
  int32 pane_id = 1;
  int32 scrollback_len = 2;
  repeated string rows = 3;
}

message MsgPaneResync {
  int32 pane_id = 1;
}

message MsgDetach {}

message MsgShutdown {}

message MsgStatusRequest {}

message ClientMessage {
  oneof msg {
    MsgAttach attach = 1;
    MsgVerb verb = 2;
    MsgMouse mouse = 3;
    MsgInput input = 4;
    MsgResize resize = 5;
    MsgScroll scroll = 6;
    MsgPaneResync pane_resync = 7;
    MsgDetach detach = 8;
    MsgShutdown shutdown = 9;
    MsgStatusRequest status_request = 10;
    MsgTrafficRequest traffic_request = 11;
    MsgSplitRequest split_request = 12;
    MsgSendInputRequest send_input_request = 13;
    MsgCaptureRequest capture_request = 14;
    MsgClosePaneRequest close_pane_request = 15;
    MsgHistoryRequest history_request = 16;
    MsgWaitRequest wait_request = 17;
    MsgSetPaneWidth set_pane_width = 18;
  }
}

message MsgWaitRequest {
  int32 pane_id = 1;
}

message MsgWaitResponse {
  int32 pane_id = 1;
  int32 exit_code = 2;
  string error = 3;
}

message MsgSplitRequest {
  string command = 1;
  string cwd = 2;
  int32 after_pane_id = 3;
  bool keep = 4;
}

message MsgSplitResponse {
  int32 pane_id = 1;
  string error = 2;
}

message MsgSendInputRequest {
  int32 pane_id = 1;
  bytes data = 2;
}

message MsgSendInputResponse {
  int32 pane_id = 1;
  string error = 2;
}

message MsgCaptureRequest {
  int32 pane_id = 1;
  bool scrollback = 2;
  int32 lines = 3;
}

message MsgCaptureResponse {
  int32 pane_id = 1;
  string text = 2;
  string error = 3;
}

message MsgClosePaneRequest {
  int32 pane_id = 1;
}

message MsgClosePaneResponse {
  int32 pane_id = 1;
  string error = 2;
}

// Traffic counters for `wideboi status --traffic` (#179). Counts and
// timings only: never cell contents, titles, input or tokens.
message MsgTrafficRequest {}

message TimingStat {
  uint64 count = 1;
  uint64 total_nanos = 2;
  uint64 max_nanos = 3;
}

message ClientTraffic {
  int32 client_id = 1;
  string transport = 2;           // "socket", "websocket", "inproc"
  int64 connected_millis = 3;
  uint64 full_updates = 4;
  uint64 row_patches = 5;
  uint64 shift_patches = 6;
  uint64 changed_rows = 7;
  uint64 resync_requests = 8;
  uint64 send_failures = 9;
  uint64 messages = 10;           // every message the transport encoded
  uint64 payload_bytes = 11;      // protobuf envelope bytes, all messages
  uint64 pane_payload_bytes = 12; // protobuf bytes of pane updates + patches
  uint64 wire_bytes = 13;         // bytes written to the net.Conn
  TimingStat encode = 14;
}

message MsgTrafficStats {
  int64 uptime_millis = 1;
  bool timing_enabled = 2;
  repeated ClientTraffic clients = 3;
  ClientTraffic departed = 4;     // sum over attached clients that have left
  TimingStat render = 5;
  TimingStat build_patch = 6;
}
