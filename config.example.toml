# wideboi configuration example
#
# Default discovery location:
#   $XDG_CONFIG_HOME/wideboi/config.toml (usually ~/.config/wideboi/config.toml)
# Or specify a custom config file path:
#   wideboi -c /path/to/config.toml
#
# Precedence order (highest to lowest):
#   1. Command-line flags (-l, -p, -s, --shell)
#   2. Environment variable overrides (WIDEBOI_LAYOUT, WIDEBOI_PREFIX, WIDEBOI_SOCK, WIDEBOI_SHELL,
#      WIDEBOI_LOG_LEVEL, WIDEBOI_AUTO_CLEANUP)
#   3. Configuration file (this file)
#   4. Defaults (including $SHELL or /bin/sh)

# Starting layout for each client: "cards" (default) or "scroll". C-b c toggles it for that client only.
layout = "cards"

# Prefix key used to enter control mode: "ctrl+<letter>" or "ctrl+space"
# Note: "ctrl+i", "ctrl+m", and "ctrl+[" are reserved (they decode as Tab, Enter, Escape).
prefix = "ctrl+b"

# Session to start or attach to. Its socket is $TMPDIR/wideboi-<uid>/<name>.sock.
# Defaults to "default". Set this or socket, not both.
# session = "default"

# Unix domain socket path for client/server communication, instead of a session name.
# socket = "/path/to/socket.sock"

# Address to bind the WebSocket server for the Web Client.
# Bind to loopback for local use or an HTTPS reverse proxy on this host.
# A wildcard address such as ":8080" exposes unencrypted HTTP/WS to the network.
# Defaults to empty (disabled).
# websocket = "127.0.0.1:8080"

# Optional fixed token for WebSocket clients. Without it, a token is generated
# at server startup and shown once in a link on stderr.
# websocket_token = "your-secret-token"

# Shell executable to spawn in new panes.
# Defaults to $SHELL, or /bin/sh if $SHELL is empty.
# shell = "/bin/zsh"

# Width presets (in columns) cycled by cycle_width ('w').
# Each preset must be at least 20 columns.
# width_presets = [40, 60, 80]

# Initial columns for a newly created session. Each [[startup]] entry opens
# one column, in order. Omit command for an interactive shell; commands run
# through the configured shell with `-c`. Width must be 20–4096 cells;
# omit it for the normal width.
# A project .wideboi.toml can replace the whole list for that project.
# [[startup]]
# command = "nvim"
# width = 100
# [[startup]]
# [[startup]]
# command = "claude"
# width = 80

# Mouse support: click to focus, wheel to scroll, drag to copy (OSC 52).
# Set to false to leave the mouse to your terminal, which restores its own
# selection and scrollback wheel. Defaults to true.
# mouse = true

# Theme styling for TUI chrome (status bar, badges, dividers, and sliver spines).
# Color names: "black", "red", "green", "yellow", "blue", "magenta", "cyan", "white",
# "bright_black" (or "gray"), "bright_red", "bright_green", "bright_yellow",
# "bright_blue", "bright_magenta", "bright_cyan", "bright_white", or ANSI numbers 0-255.
# Attributes: "bold", "dim" (or "faint"), "reverse".
# Respects the standard NO_COLOR environment variable (disabling colors while keeping glyphs/attributes).
# [theme]
# working       = "cyan"
# needs_input   = "yellow bold"
# done          = "green"
# failed        = "red bold"
# focus         = "bright_cyan bold"
# dim           = "dim"
# divider       = "dim"
# focus_divider = "bright_cyan bold"

# Log verbosity for $TMPDIR/wideboi-<uid>/{client,server}.log:
# "trace", "debug", "info" (default), "warn" or "error". The logs are
# appended to forever, and trace records every message a client receives,
# so raise it only while chasing something.
# log_level = "info"

# Automatically clean up dead sockets, web tokens, and remove session logs
# on clean exit. Preserves logs if terminated abnormally or by signal.
# Set to false to retain logs for post-exit inspection. Defaults to true.
# auto_cleanup = true

# Key remapping for control mode
#
# Remap actions to customize your control-mode shortcuts.
# Unmentioned actions retain their defaults.
#
# A value is one key ("h"), a list of keys (["h", "left"]), or an empty
# list ([]) to unbind the action. Setting an action replaces ALL of its
# default keys, so list every key you want to keep. The first key in a
# list is the one the status bar and help overlay show.
#
# Constraints:
# - Keys "i", "m", and "[" are reserved and cannot be bound (their control
#   bytes decode as Tab, Enter, and Escape, breaking repeat chords).
# - No two actions may share a key, even if the other action is left at
#   its defaults: remap it too.
# - quit cannot be unbound; it is the only way to end the session.
# - Every single lowercase letter (a-z) bound to an action gets a matching
#   ctrl repeat chord (e.g. key "x" -> "ctrl+x" repeat), except toggle_cards:
#   repeating a toggle only undoes it.
[keys]
# Navigation & Scrolling
focus_left   = ["h", "left"]   # Move focus to the left column
focus_right  = ["l", "right"]  # Move focus to the right column
scroll_down  = "j"    # Scroll focused pane history down (forward in time)
scroll_up    = "k"    # Scroll focused pane history up (back into history)

# Pane & Column Management
new_column   = "n"    # Open a new column
cycle_width  = "w"    # Cycle width of focused column across presets
shrink_width = "o"    # Shrink focused column width by 10 cells (overlay only)
grow_width   = "p"    # Grow focused column width by 10 cells (overlay only)
move_left    = "y"    # Move focused column one place left (overlay only)
move_right   = "u"    # Move focused column one place right (overlay only)
kill_pane    = "x"    # Kill focused pane
smart_jump   = "a"    # Jump to pane requesting attention (OSC 133 / prompt)
toggle_status= "s"    # Open or focus the pane status dashboard
focus_last   = "tab"  # Focus the previously focused pane (overlay only)
toggle_cards = "c"    # Toggle cards / scrolling layout (help overlay only)

# Session Controls
help         = "?"    # Show the control-mode help overlay
detach       = "d"    # Detach from socket session (leaves session running)
quit         = "q"    # Quit wideboi and close all panes
exit         = "esc"  # Exit control mode without performing an action
